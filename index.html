<style>
/* Layout: one centered column (max 1120px), a 64px header with the role switcher, the ask box as the only hero. Cards are flat with a hairline border; the accent is reserved for primary actions and the model's reading. */

  --r: 14px; --r-s: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

  --ok: #5CC48A; --ok-soft: #163324; --warn: #E0B354; --warn-soft: #3A2E12; --bad: #F28B82; --bad-soft: #3D1F1D;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark } }
:root[data-theme="dark"] {

  --line: #2C2D32; --line-2: #3D3E44; --accent: #7FA8F0; --accent-ink: #0E1B33; --accent-soft: #1D2A44;
  --ok: #5CC48A; --ok-soft: #163324; --warn: #E0B354; --warn-soft: #3A2E12; --bad: #F28B82; --bad-soft: #3D1F1D;

html { height: 100% }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased }
* { box-sizing: border-box }
a { color: var(--accent); text-decoration: none } a:hover { text-decoration: underline; text-underline-offset: 3px }
button { font: inherit; color: inherit } input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -0.015em; line-height: 1.2 }
h1 { font-size: 26px; font-weight: 700 } h2 { font-size: 18px; font-weight: 600 } h3 { font-size: 15px; font-weight: 600 }
p { margin: 0 }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line) }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.hdr .wrap { display: flex; align-items: center; gap: 18px; min-height: 64px; flex-wrap: wrap; padding-block: 8px }
.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; color: var(--ink); text-decoration: none }
.brand:hover { text-decoration: none }
.brand .mark { width: 26px; height: 26px; border-radius: 8px; background: var(--ink); display: inline-block; position: relative }
.brand .mark::after { content: ""; position: absolute; left: 7px; top: 7px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg) }
.nav { display: flex; gap: 4px; flex-wrap: wrap }
.nav a, .nav span { display: inline-flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 999px; color: var(--ink-2); font-weight: 500; text-decoration: none }
.nav a:hover { background: var(--surface); text-decoration: none; color: var(--ink) }
.nav a.on { background: var(--surface-2); color: var(--ink); font-weight: 600 }
.nav span.soon { color: var(--ink-3); border: 1px dashed var(--line-2); font-size: 13px }
.hdr-right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap }
.role { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 10px 0 12px; border: 1px solid var(--line-2); border-radius: 999px; background: var(--bg); font-size: 13px; color: var(--ink-2) }
.role select { border: 0; background: transparent; font-weight: 600; color: var(--ink); min-height: 36px; max-width: 220px }
.who { font-size: 13px; color: var(--ink-3) }
main { padding-block: 28px 56px }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--bg); color: var(--ink); font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; white-space: nowrap }
.btn:hover { background: var(--surface); text-decoration: none }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink) } .btn.primary:hover { opacity: .9 }
.btn.accent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent) } .btn.ghost:hover { background: var(--accent-soft) }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13px }
.btn:disabled { opacity: .5; cursor: not-allowed }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent) }
.pill { display: inline-flex; align-items: center; gap: 4px; min-height: 34px; padding: 0 6px 0 12px; border: 1px solid var(--line-2); border-radius: 999px; font-size: 13px; background: var(--bg) }
.pill .k { color: var(--ink-3); margin-right: 2px }
.pill button { width: 26px; height: 26px; border: 0; border-radius: 50%; background: transparent; cursor: pointer; color: var(--ink-2); font-size: 16px; line-height: 1 } .pill button:hover { background: var(--surface-2) }
.chip { display: inline-flex; align-items: center; min-height: 36px; padding: 0 14px; border: 1px solid var(--line-2); border-radius: 999px; background: var(--bg); font-size: 13.5px; cursor: pointer; font-weight: 500 } .chip:hover { background: var(--surface) }
.badge { display: inline-flex; align-items: center; gap: 6px; min-height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 600; letter-spacing: .01em; border: 1px solid transparent; white-space: nowrap }
.badge.live { background: var(--ok-soft); color: var(--ok) } .badge.expiring { background: var(--warn-soft); color: var(--warn) } .badge.pending { background: var(--surface-2); color: var(--ink-2) } .badge.returned { background: var(--bad-soft); color: var(--bad) } .badge.expired { background: transparent; color: var(--ink-3); border-color: var(--line-2); text-decoration: line-through } .badge.draft { background: transparent; color: var(--ink-3); border: 1px dashed var(--line-2) } .badge.archived { color: var(--ink-3); border-color: var(--line) } .badge.missing { color: var(--ink-3); border: 1px dashed var(--line-2) } .badge.request { background: var(--accent-soft); color: var(--accent) }
.card { border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); padding: 20px 22px }
.card.soft { background: var(--surface); border-color: transparent }
.muted { color: var(--ink-2) } .faint { color: var(--ink-3) } .small { font-size: 13px } .tiny { font-size: 12px }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap } .col { display: flex; flex-direction: column; gap: 12px }
.between { justify-content: space-between } .grow { flex: 1 1 auto; min-width: 0 }
.stack > * + * { margin-top: 14px }
.thumb { background: var(--surface-2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--ink-3); font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; overflow: hidden }
.thumb img, .thumb video { width: 100%; height: 100%; object-fit: cover }
/* ask */
.hero { display: flex; flex-direction: column; align-items: center; gap: 24px; padding-block: 72px 40px; text-align: center }
.hero .word { font-size: 42px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; display: flex; align-items: center; gap: 14px }
.hero .word .mark { width: 40px; height: 40px; border-radius: 12px; background: var(--ink); position: relative } .hero .word .mark::after { content: ""; position: absolute; left: 11px; top: 11px; width: 18px; height: 18px; border-radius: 50%; background: var(--bg) }
.askbox { width: 100%; max-width: 720px; display: flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); border-radius: 999px; padding: 0 8px 0 18px; background: var(--bg); box-shadow: var(--shadow) }
.askbox:focus-within { border-color: var(--accent) }
.askbox input { flex: 1 1 auto; min-width: 0; min-height: 56px; border: 0; outline: 0; background: transparent; font-size: 17px }
.askbox.compact input { min-height: 46px; font-size: 15px }
.askbox .go { width: 42px; height: 42px; border: 0; border-radius: 50%; background: var(--ink); color: var(--bg); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: 0 0 auto }
.askbox.compact .go { width: 36px; height: 36px }
.examples { display: flex; flex-direction: column; align-items: center; gap: 6px }
.examples button { border: 0; background: transparent; min-height: 36px; padding: 0 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; color: var(--ink-2); font-size: 14.5px; border-radius: 999px } .examples button:hover { background: var(--surface) }
.examples .k { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); min-width: 72px; text-align: right }
.examples .t { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2) }
.reading { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; color: var(--ink-2) }
.reading .src { font-size: 12px; color: var(--ink-3); margin-left: 4px }
.answer { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px }
.answer.kit-open { grid-template-columns: minmax(0, 1fr) 300px }
@media (max-width: 860px) { .answer.kit-open { grid-template-columns: minmax(0, 1fr) } }
.pcard { border: 1px solid var(--line); border-radius: var(--r); padding: 20px 22px; display: flex; flex-direction: column; gap: 12px }
.pcard .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap }
.pcard .logo { width: 44px; height: 44px; border-radius: 12px; background: var(--surface-2); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; color: var(--ink-2); flex: 0 0 auto }
.arow { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap }
.arow .thumb { width: 56px; height: 38px; flex: 0 0 auto; font-size: 10px }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px }
.acard { display: flex; flex-direction: column; gap: 8px }
.acard .thumb { aspect-ratio: 16 / 10; width: 100%; max-width: 100%; font-size: 12px }
.acard .title { font-weight: 600; color: var(--ink); line-height: 1.3 }
.kitpanel { border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 8px; align-self: start; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px) }
.kitpanel .item { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px }
/* tables */
.table { border: 1px solid var(--line); border-radius: var(--r); overflow-x: auto }
table { border-collapse: collapse; width: 100%; min-width: 720px; font-size: 14px }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--ink-3); letter-spacing: .04em; text-transform: uppercase; padding: 12px 14px; border-bottom: 1px solid var(--line) }
td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle } tr:last-child td { border-bottom: 0 }
.num { font-variant-numeric: tabular-nums }

.in, select.in, textarea.in { min-height: 42px; border: 1px solid var(--line-2); border-radius: var(--r-s); padding: 8px 12px; background: var(--bg); font-size: 14px; font-weight: 400; width: 100% } textarea.in { resize: vertical }
.check { display: flex; align-items: center; gap: 10px; min-height: 32px; font-size: 14px; font-weight: 400 } .check input { width: 18px; height: 18px; margin: 0 }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px } @media (max-width: 700px) { .fgrid { grid-template-columns: minmax(0, 1fr) } }
.drop { border: 1.5px dashed var(--line-2); border-radius: var(--r); padding: 28px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; background: var(--surface) }
.steps { display: flex; align-items: center; gap: 8px; font-size: 13.5px; flex-wrap: wrap }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 600; box-shadow: var(--shadow); z-index: 20; max-width: calc(100% - 32px) }
.empty { border: 1.5px dashed var(--line-2); border-radius: var(--r); padding: 28px 24px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start }
.sk { background: var(--surface-2); border-radius: 6px; height: 14px }
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3) }
.two { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start } @media (max-width: 900px) { .two { grid-template-columns: minmax(0, 1fr) } }
.split { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 24px; align-items: start } @media (max-width: 900px) { .split { grid-template-columns: minmax(0, 1fr) } }
.qitem { width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--bg); cursor: pointer; display: flex; flex-direction: column; gap: 4px } .qitem.on { border-color: var(--ink); background: var(--surface) }
.email { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; max-width: 680px } .email .meta { background: var(--surface); padding: 12px 20px; font-size: 13px; color: var(--ink-2); display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 4px 10px } .email .body { padding: 24px 28px; display: flex; flex-direction: column; gap: 18px }
.dl { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px 12px; font-size: 14px; margin: 0 } .dl dt { color: var(--ink-3) } .dl dd { margin: 0 }
@media (prefers-reduced-motion: no-preference) { .btn, .chip, .pill, .qitem { transition: background .15s, border-color .15s } }
</style>

async function fetchBlob(id) { try { const r = await fetch('/_blob/' + id); if (!r.ok) return null; return new Uint8Array(await r.arrayBuffer()); } catch (e) { return null; } }
